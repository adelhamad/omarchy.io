    <style>
      @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap");

      :root {
        --background: #1a1b26;
        --text: #c0caf5;
        --muted: #7982a9;
        --accent: #9ece6a;
        --link: #7dcfff;
      }

      * { box-sizing: border-box; }

      html {
        min-width: 320px;
        background: var(--background);
        color-scheme: dark;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        place-items: center;
        background: var(--background);
        color: var(--text);
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 14px;
        line-height: 1.7;
      }

      main {
        width: min(520px, calc(100% - 48px));
        padding: 48px 0;
      }

      .site {
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.08em;
        text-decoration: none;
      }

      h1 {
        margin: 16px 0 22px;
        color: var(--accent);
        font-size: clamp(2rem, 8vw, 3rem);
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1.1;
      }

      p { margin: 0; }

      .domain {
        margin-top: 20px;
        color: var(--muted);
        font-size: 12px;
      }

      a {
        color: var(--link);
        text-underline-offset: 3px;
      }

      a:hover { color: var(--accent); }

      a:focus-visible {
        outline: 2px solid var(--link);
        outline-offset: 4px;
      }

      footer {
        display: flex;
        gap: 14px;
        margin-top: 36px;
        font-size: 11px;
      }

      footer a { color: var(--muted); }
